services:
  - type: web
    name: office-agent-sim
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: OFFICE_DATA_DIR
        value: /data
      - key: XAI_API_KEY
        sync: false
